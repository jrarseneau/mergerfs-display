# MergerFS Pool Monitor Configuration
# Copy this file to config.yaml and adjust for your system

pools:
  # Example pool configuration
  - name: "Main Storage Pool"
    path: "/mnt/pool"

  # You can add multiple pools
  # - name: "Media Pool"
  #   path: "/mnt/media"

  # - name: "Backup Pool"
  #   path: "/mnt/backup"

# Web server configuration (optional)
web:
  port: 8090  # Port for the web interface (default: 8090)
  host: "0.0.0.0"  # Host to bind to (0.0.0.0 allows external access)
